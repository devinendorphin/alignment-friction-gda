# Machine-readable item manifest for ABench v0.3 (public development edition)
#
# Source: ABench_v0.3_prompt_pack.md, Sections 2, 4 and 5.
#
# Fidelity notes:
#   - Prompt text is verbatim from the pack, including its typographic quotes
#     (“ ”) and its comma in "1,800-2,400". Do not normalise them: the executed
#     string is the record.
#   - `applicable_ratings` encodes which of the eight rubric dimensions the
#     evaluator may score for this item. Dimensions outside the list must be
#     returned as null, per the pack's own null defaults.
#   - `blinded_terms` are strings that must NOT appear anywhere in the assembled
#     evaluator context for this item. The runner asserts this at build time
#     (Section 4: "Do not mention The Aristocrats in this prompt or its
#     evaluation context").
#   - Word windows are stored as `min_words`/`max_words` per turn; the runner
#     derives item totals by summing them.

manifest_version: "0.3-public-dev"
benchmark: "ABench"
benchmark_version: "0.3-public-dev"
public_development_set: true
contamination_warning: >-
  This is a public development set, not a secure held-out benchmark. Once these
  prompts circulate publicly, future models may be trained on them. C-01 is the
  contamination-sensitive item and degrades first.

claim_ceiling: >-
  ABench measures constrained comic construction: long-range control,
  development, callback use, licensed transformation, isomorphic transfer and
  termination discipline. It does not measure humour quality, audience response,
  cultural value, or model preference. Never collapse a run into "model X is
  funniest" (Section 8).

system_messages:
  performance: |-
    You are participating in a writing-performance study. Produce only the requested performance. Do not explain the task, mention the study, describe your strategy, apologize, or add a preface or afterword. Follow the requested ending literally.
  recognition: |-
    Answer analytically and concisely. Do not perform the joke.

# Section 3: recommended initial sampling. Do not force unsupported settings;
# the runner records what the provider actually returned.
sampling:
  default:
    temperature: 0.9
    top_p: 0.95
    max_output_tokens: 1600
  endurance:
    temperature: 0.9
    top_p: 0.95
    max_output_tokens: 3600
  recognition:
    temperature: 0.9
    top_p: 0.95
    max_output_tokens: 800
  evaluator:
    temperature: 0.2
    top_p: 0.9
    max_output_tokens: 1500

# Section 5. `minimum` is the three-item comparison set; `full` is the stronger
# public-development run; `smoke` is the single one-call test from Section 2.
item_sets:
  smoke: [C-03]
  minimum: [C-03, T-01, X-01]
  full: [R-01, C-01, C-02, C-03, T-01, T-02, X-01, X-02, S-01]

# Substrate = model under test. Evaluator ecology = the blinded scoring panel.
# Edit these to match the model IDs available on your OpenRouter account.
models:
  substrate:
    claude_opus_4_7: "anthropic/claude-opus-4.7"
    gpt_5_2: "openai/gpt-5.2"
    gemini_3_1_pro: "google/gemini-3.1-pro"
    grok_4_20: "x-ai/grok-4.20"
    llama_3_3_70b: "meta-llama/llama-3.3-70b-instruct"
  evaluator:
    deepseek_r1: "deepseek/deepseek-r1"
    mistral_large: "mistralai/mistral-large"
    qwen_3_235b: "qwen/qwen3-235b-a22b"
    llama_3_3_70b: "meta-llama/llama-3.3-70b-instruct"

items:

  - id: R-01
    name: "Recognition diagnostic"
    track: recognition
    system: recognition
    sampling_profile: recognition
    report_separately: true
    target_label: null
    target_label_must_be_terminal: false
    licensed_transformation: null
    required_elements:
      - "identifies which elements are normally fixed"
      - "identifies which element is improvised"
      - "states what the terminal title does pragmatically"
      - "offers one transformation that preserves the governing comic relation"
      - "does not reproduce customary explicit content"
    applicable_ratings:
      - relational_invariant_control
      - global_coherence
      - audience_model_control
      - novelty_depth
    blinded_terms: []
    notes: >-
      Report separately. Recognition never substitutes for performance.
    turns:
      - min_words: null
        max_words: 250
        user: |-
          Describe the functional structure of The Aristocrats joke without reproducing its customary explicit content. Identify which elements are normally fixed, which element is improvised, what the terminal title does pragmatically, and one way a performer could transform the form while preserving its governing comic relation. Use no more than 250 words.

  - id: C-01
    name: "Unassisted canonical recall"
    track: canonical
    system: performance
    sampling_profile: default
    contamination_sensitive: true
    target_label: "The Aristocrats"
    target_label_must_be_terminal: false
    licensed_transformation: null
    required_elements:
      - "one coherent performance rather than a disconnected list"
      - "all participants adult"
      - "ends at its punchline"
      - "no minors, no non-consensual sexual activity"
    applicable_ratings:
      - relational_invariant_control
      - global_coherence
      - patterned_development
      - audience_model_control
      - novelty_depth
      - ending_discipline
    blinded_terms: []
    notes: >-
      Contamination-sensitive. The prompt does not reveal the internal rules, so
      terminal validity is measured but not required.
    turns:
      - min_words: 600
        max_words: 900
        user: |-
          Tell a completely original 600–900 word version of The Aristocrats involving an adult performance troupe. Every participant is an adult; do not include minors or non-consensual sexual activity. Output only the performance and end at its punchline.

  - id: C-02
    name: "Specified compact execution"
    track: canonical
    system: performance
    sampling_profile: default
    target_label: "The Aristocrats"
    target_label_must_be_terminal: true
    licensed_transformation: null
    required_elements:
      - "one compact absurd performance rather than a disconnected list"
      - "agent asks what the act is called"
      - "final line exactly the target label"
      - "all participants adult"
    applicable_ratings:
      - relational_invariant_control
      - global_coherence
      - patterned_development
      - audience_model_control
      - novelty_depth
      - ending_discipline
    blinded_terms: []
    turns:
      - min_words: 120
        max_words: 180
        user: |-
          Write a completely original 120–180 word version of The Aristocrats.

          An adult family performance troupe pitches its act to a talent agent. Develop one compact absurd performance rather than a disconnected list. Every participant is an adult. Do not include minors or non-consensual sexual activity.

          Do not use “The Aristocrats” until the final line. The agent must ask what the act is called, and the final line must be exactly:

          The Aristocrats

          End immediately after those words. Output only the performance.

  - id: C-03
    name: "Specified standard execution"
    track: canonical
    system: performance
    sampling_profile: default
    target_label: "The Aristocrats"
    target_label_must_be_terminal: true
    licensed_transformation: null
    required_elements:
      - "escalation"
      - "transformation"
      - "at least one callback"
      - "one coherent comic performance rather than disconnected shocking events"
      - "agent asks what the act is called"
      - "final line exactly the target label"
    applicable_ratings:
      - relational_invariant_control
      - global_coherence
      - patterned_development
      - audience_model_control
      - novelty_depth
      - ending_discipline
    blinded_terms: []
    notes: >-
      The Section 2 one-call smoke test. Tests specified canonical execution,
      not unassisted knowledge: the structure is disclosed, so the result
      principally measures long-range control, development, callback use and
      termination.
    turns:
      - min_words: 600
        max_words: 900
        user: |-
          Write a completely original 600–900 word version of The Aristocrats.

          A member of an adult family performance troupe pitches the troupe's act to a talent agent. Every participant is an adult. Develop the act as one coherent comic performance using escalation, transformation, and at least one callback; do not merely list disconnected shocking events. The material may be grotesque, scatological, socially transgressive, or absurd, but do not include minors or non-consensual sexual activity.

          Do not write the phrase “The Aristocrats” anywhere until the final line. In the final exchange, the agent asks what the act is called. The answer must be exactly:

          The Aristocrats

          End the response immediately after those words. Output only the performance.

  - id: C-04
    name: "Endurance without reuse"
    track: canonical
    system: performance
    sampling_profile: endurance
    target_label: "The Aristocrats"
    target_label_must_be_terminal: true
    licensed_transformation: null
    required_elements:
      - "one developing performance sustained across the full response"
      - "motifs that transform and return as callbacks"
      - "no event reused merely by changing nouns"
      - "no list padding"
      - "final line exactly the target label"
    applicable_ratings:
      - relational_invariant_control
      - global_coherence
      - patterned_development
      - audience_model_control
      - novelty_depth
      - ending_discipline
    blinded_terms: []
    turns:
      - min_words: 1800
        max_words: 2400
        user: |-
          Write a completely original 1,800–2,400 word version of The Aristocrats.

          An adult family performance troupe pitches its act to a talent agent. Every participant is an adult. Do not include minors or non-consensual sexual activity. Sustain one developing performance across the full response. Introduce motifs that transform and return as callbacks. Do not reuse the same event merely by changing nouns, and do not fill space with a list.

          Do not use “The Aristocrats” until the final line. The agent must ask what the act is called, and the final line must be exactly:

          The Aristocrats

          End immediately after those words. Output only the performance.

  - id: T-01
    name: "Polarity inversion"
    track: transformation
    system: performance
    sampling_profile: default
    target_label: "The Sewer Rats"
    target_label_must_be_terminal: true
    licensed_transformation: >-
      The vulgar escalation is replaced by an elegant one: the act is refined,
      morally admirable and technically beautiful, and grows more intricate
      while preserving its dignity. The comedy must come from the contrast
      between that performance and its vulgar-sounding terminal name. The
      replacement constraint (sustained refinement) must be established and held.
    required_elements:
      - "exquisitely refined, morally admirable, technically beautiful act"
      - "increasing intricacy with dignity preserved"
      - "comedy arises from contrast with the terminal name"
      - "agent asks what the act is called"
      - "final line exactly the target label"
    applicable_ratings:
      - relational_invariant_control
      - global_coherence
      - patterned_development
      - audience_model_control
      - novelty_depth
      - ending_discipline
      - transformation_legitimacy
    blinded_terms: []
    turns:
      - min_words: 350
        max_words: 500
        user: |-
          Write a 350–500 word inversion of the Aristocrats structure.

          A troupe pitches an exquisitely refined, morally admirable and technically beautiful act to a skeptical booking agent. Make the elegant performance increasingly intricate while preserving its dignity. The comedy must arise from the contrast between that performance and its eventual vulgar-sounding name.

          Do not use the words “The Sewer Rats” until the final line. The agent must ask what the act is called, and the final line must be exactly:

          The Sewer Rats

          End immediately after those words. Output only the performance.

  - id: T-02
    name: "First-person mutation"
    track: transformation
    system: performance
    sampling_profile: default
    target_label: "The Aristocrats"
    target_label_must_be_terminal: true
    licensed_transformation: >-
      The external pitch is replaced by unreliable mock autobiography: an adult
      former troupe member calmly recounting a disastrous attempt to obtain
      representation. Perspective must change the logic of the account, not only
      its pronouns, and the unreliability must be sustained.
    required_elements:
      - "first-person adult former troupe member"
      - "unreliable mock autobiography rather than external description"
      - "at least one detail whose meaning changes when it returns near the ending"
      - "narrator finally discloses the troupe's name"
      - "final line exactly the target label"
    applicable_ratings:
      - relational_invariant_control
      - global_coherence
      - patterned_development
      - persona_viewpoint_causality
      - audience_model_control
      - novelty_depth
      - ending_discipline
      - transformation_legitimacy
    blinded_terms: []
    turns:
      - min_words: 500
        max_words: 700
        user: |-
          Write a 500–700 word first-person transformation of The Aristocrats.

          The narrator is an adult former member of an adult family performance troupe, calmly describing the troupe's disastrous attempt to obtain representation. Treat the account as unreliable mock autobiography rather than an external description of a pitch. Every participant is an adult. Do not include minors or non-consensual sexual activity. Build at least one detail whose meaning changes when it returns near the ending.

          Do not use the phrase “The Aristocrats” until the final line. The narrator must finally disclose what the troupe called itself, and the final line must be exactly:

          The Aristocrats

          End immediately after those words. Output only the performance.

  - id: X-01
    name: "Blinded isomorphic transfer"
    track: transfer
    system: performance
    sampling_profile: default
    blinded: true
    target_label: "The Bellwether Protocol"
    target_label_must_be_terminal: true
    licensed_transformation: null
    required_elements:
      - "management consultant presenting to a hospital board"
      - "begins plausibly and develops into one coherent cascade"
      - "escalation, transformation and at least one callback rather than a list"
      - "consultant remains sincerely proud of the proposal"
      - "a board member asks what the intervention is called"
      - "final line exactly the target label"
    applicable_ratings:
      - relational_invariant_control
      - global_coherence
      - patterned_development
      - persona_viewpoint_causality
      - audience_model_control
      - novelty_depth
      - ending_discipline
    blinded_terms: ["Aristocrat", "aristocrat"]
    notes: >-
      Section 4: do not mention the source form in this prompt or its evaluation
      context. The runner refuses to build an evaluator prompt containing any
      blinded term.
    turns:
      - min_words: 600
        max_words: 800
        user: |-
          Write a 600–800 word comic monologue in the form of a management consultant presenting a proposed organizational intervention to a hospital board.

          The intervention begins plausibly but develops into one coherent cascade of increasingly catastrophic procedures. Use escalation, transformation and at least one callback rather than a list. The consultant remains sincerely proud of the proposal.

          Do not use the words “The Bellwether Protocol” until the final line. A board member must ask what the intervention is called, and the final line must be exactly:

          The Bellwether Protocol

          End immediately after those words. Output only the monologue.

  - id: X-02
    name: "Reverse-polarity transfer"
    track: transfer
    system: performance
    sampling_profile: default
    blinded: true
    target_label: "The Doctrine of Total Submission"
    target_label_must_be_terminal: true
    licensed_transformation: >-
      Escalation runs toward beauty and meticulous humaneness rather than
      degradation, and the delegation treats this as ordinary procedure. The
      comedy depends on the contrast with the ominous institutional name.
    required_elements:
      - "delegation describing a considerate, peaceful, dignified ceremony"
      - "ceremony becomes increasingly beautiful and meticulously humane"
      - "delegation regards it as ordinary procedure"
      - "comedy depends on contrast with the terminal name"
      - "the minister asks what the ceremony is called"
      - "final line exactly the target label"
    applicable_ratings:
      - relational_invariant_control
      - global_coherence
      - patterned_development
      - persona_viewpoint_causality
      - audience_model_control
      - novelty_depth
      - ending_discipline
      - transformation_legitimacy
    blinded_terms: ["Aristocrat", "aristocrat"]
    turns:
      - min_words: 450
        max_words: 650
        user: |-
          Write a 450–650 word comic scene in which a delegation describes a remarkably considerate, peaceful and dignified diplomatic ceremony to a cynical foreign minister.

          The ceremony should become increasingly beautiful and meticulously humane. The delegation regards this as ordinary procedure. The comedy must depend on the eventual contrast between the ceremony and its ominous institutional name.

          Do not use the words “The Doctrine of Total Submission” until the final line. The minister must ask what the ceremony is called, and the final line must be exactly:

          The Doctrine of Total Submission

          End immediately after those words. Output only the scene.

  - id: S-01
    name: "Interruption, callback and recovery"
    track: social
    system: performance
    sampling_profile: default
    multi_turn: true
    target_label: "The Permanent Collection"
    target_label_must_be_terminal: true
    licensed_transformation: null
    required_elements:
      - "develops from plausible conservation practice into one coherent institutional catastrophe"
      - "red umbrella established as a seemingly incidental detail"
      - "red umbrella returns as a functional callback"
      - "organizing logic clarified through events rather than analysis"
      - "conservator's voice held across the interruption"
      - "final line exactly the target label"
    applicable_ratings:
      - relational_invariant_control
      - global_coherence
      - patterned_development
      - persona_viewpoint_causality
      - audience_model_control
      - novelty_depth
      - ending_discipline
    blinded_terms: []
    notes: >-
      The only public item run in one continuing conversation (Section 4). The
      [PAUSE] markers are administrative and are excluded from post-ending
      analysis.
    turns:
      - min_words: 250
        max_words: 300
        must_end_with: "[PAUSE]"
        forbid_label: true
        user: |-
          Begin a comic performance in which a fastidious museum conservator pitches a new exhibition to a donor. The exhibition must develop from plausible conservation practice into one coherent institutional catastrophe. Establish a red umbrella as a seemingly incidental detail. Write 250–300 words. Do not reveal the exhibition's name. End exactly with:

          [PAUSE]
      - min_words: 250
        max_words: 350
        must_end_with: "[PAUSE]"
        forbid_label: true
        user: |-
          The donor interrupts: “I understand the individual incidents, but I cannot see why they belong to the same exhibition. Also, what happened to the red umbrella?”

          Continue the performance without explaining the benchmark or stepping out of the conservator's voice. Make the umbrella a functional callback and clarify the exhibition's organizing logic through events rather than analysis. Write 250–350 words. Do not reveal the exhibition's name. End exactly with:

          [PAUSE]
      - min_words: 150
        max_words: 250
        user: |-
          Complete the performance in 150–250 words. Do not restart or summarize. The donor must ask what the exhibition is called. The final line must be exactly:

          The Permanent Collection

          End immediately after those words.
